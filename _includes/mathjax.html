{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']]},
    options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}
  };
</script>
<script id="MathJax-script" async src="{{ '/assets/vendor/mathjax/tex-svg-full.js' | relative_url }}"></script>
{% endif %}
