<article class="note-card" data-tone="{{ include.note.domain | note_tone }}" data-note-url="{{ include.note.url | relative_url }}" data-domain="{{ include.note.domain | escape }}" data-tags="{{ include.note.tags | jsonify | escape }}">
  <div class="note-card__meta"><span class="field-badge" data-tone="{{ include.note.domain | note_tone }}">{{ include.note.domain | default: 'Notes' }}</span><time datetime="{{ include.note.date | date_to_xmlschema }}">{{ include.note.date | date: '%b %d, %Y' }}</time></div>
  <h3><a href="{{ include.note.url | relative_url }}">{{ include.note.title }}</a></h3>
  <p>{{ include.note.description | default: include.note.excerpt | strip_html | truncate: 150 }}</p>
  <div class="tag-list">{% for tag in include.note.tags %}<a class="tag" data-tone="{{ tag | note_tone }}" href="{{ '/notes/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag }}</a>{% endfor %}</div>
</article>
