# Primary navigation: Home, Notes, and a direct link to the CV PDF.
title: Haoran Liu
name: Haoran Liu
description: Robot Engineering student interested in robot control.
url: https://honorliu.top
baseurl: ""
locale: en-US
lang: en
timezone: Asia/Shanghai
repository: HonorLiu0613/HonorLiu0613.github.io
author:
  name: Haoran Liu
  avatar: /images/profile.jpg
  bio: Robot Engineering undergraduate at Northeast Electric Power University.
  email: honorliu2026@163.com
  github: HonorLiu0613

include: [_pages]
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - tools
  - docs
  - local
  - .bundle
  - .github
  - .jekyll-cache
  - package.json
  - package-lock.json

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
  syntax_highlighter: rouge

collections:
  notes:
    output: true
    permalink: /notes/:path/
  experience:
    output: true
    permalink: /experience/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      section: notes
  - scope:
      path: ""
      type: experience
    values:
      layout: note
      section: experience

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
strict_front_matter: true
